[project]
name = "btp-agent-platform"
version = "1.0.0"
description = "Plateforme agentique SaaS spécialisée BTP — monorepo Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "btp-database",
    "btp-auth",
    "btp-llm-router",
    "btp-agents",
    "btp-vector-store",
    "btp-crm",
    "btp-ao",
    "btp-quotes",
    "btp-reports",
    "btp-documents",
    "btp-api",
    "btp-workers",
    "btp-crawler",
    "btp-telegram",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
btp-database = { workspace = true }
btp-auth = { workspace = true }
btp-llm-router = { workspace = true }
btp-agents = { workspace = true }
btp-vector-store = { workspace = true }
btp-crm = { workspace = true }
btp-ao = { workspace = true }
btp-quotes = { workspace = true }
btp-reports = { workspace = true }
btp-documents = { workspace = true }
btp-api = { workspace = true }
btp-workers = { workspace = true }
btp-crawler = { workspace = true }
btp-telegram = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Les migrations Alembic sont autogénérées (lignes longues tolérées).
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042 : le motif `(str, enum.Enum)` est volontaire (valeurs stockées en base
# via SQLAlchemy `native_enum=False`), on ne migre pas vers `StrEnum`.
ignore = ["UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "services", "tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
