[project]
name = "btp-database"
version = "1.0.0"
description = "Modèles SQLAlchemy et accès base de données — BTP Agent Platform"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btp"]
