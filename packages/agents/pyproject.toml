[project]
name = "btp-agents"
version = "1.0.0"
description = "Architecture agentique (Supervisor + agents spécialisés) — BTP Agent Platform"
requires-python = ">=3.11"
dependencies = [
    "btp-llm-router",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btp"]
