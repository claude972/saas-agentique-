[project]
name = "btp-crawler"
version = "1.0.0"
description = "Crawler de détection d'appels d'offres — BTP Agent Platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "btp-ao",
    "btp-database",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btp_crawler"]
