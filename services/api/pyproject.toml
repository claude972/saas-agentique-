[project]
name = "btp-api"
version = "1.0.0"
description = "API FastAPI — BTP Agent Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "btp-database",
    "btp-auth",
    "btp-agents",
    "btp-llm-router",
    "btp-documents",
    "btp-quotes",
    "btp-crm",
    "btp-crawler",
    "btp-telegram",
]

[project.scripts]
btp-api = "btp_api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btp_api"]
