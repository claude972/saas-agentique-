[project]
name = "btp-telegram"
version = "1.0.0"
description = "Bot Telegram (webhook entrant + notifications) — BTP Agent Platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "btp-agents",
    "btp-llm-router",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btp_telegram"]
